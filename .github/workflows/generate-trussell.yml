name: Generate Trussell Snapshot

on:
  push:
    branches: [agent/scale-globe-directory-1000]
    paths: [.github/workflows/generate-trussell.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scale-globe-directory-1000
      - name: Compact refresh output format
        run: python scripts/compact-trussell-generator.py
      - name: Generate official Trussell snapshot
        run: node scripts/refresh-trussell-foodbanks.mjs
      - name: Validate generated snapshot semantics
        run: |
          node --check scripts/refresh-trussell-foodbanks.mjs
          node --check src/data/generated/trussell-foodbanks.js
          node --input-type=module <<'NODE'
          import { trussellFoodbankResources, trussellFoodbankMetadata } from './src/data/generated/trussell-foodbanks.js';
          console.log('metadata', trussellFoodbankMetadata);
          console.log('published', trussellFoodbankResources.length);
          if (trussellFoodbankResources.length < 1250) throw new Error('Generated snapshot did not clear the minimum publishable count');
          if (new Set(trussellFoodbankResources.map((item) => item.id)).size !== trussellFoodbankResources.length) throw new Error('Generated duplicate IDs');
          for (const resource of trussellFoodbankResources) {
            if (resource.kind !== 'direct' || resource.locationPrecision !== 'exact') throw new Error(`Bad direct-site semantics: ${resource.id}`);
            if (resource.costModel !== 'free-eligible') throw new Error(`Bad free-access model: ${resource.id}`);
            if (!resource.address || !resource.sourceRecordId || !Number.isFinite(resource.lat) || !Number.isFinite(resource.lng)) throw new Error(`Incomplete generated record: ${resource.id}`);
          }
          NODE
          echo "generated_bytes=$(wc -c < src/data/generated/trussell-foodbanks.js)"
          echo "generated_lines=$(wc -l < src/data/generated/trussell-foodbanks.js)"
      - name: Commit compact generator and snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/refresh-trussell-foodbanks.mjs src/data/generated/trussell-foodbanks.js
          git commit -m "Compact the verified Trussell snapshot for faster delivery"
          git push origin HEAD:agent/scale-globe-directory-1000
