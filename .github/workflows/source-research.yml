name: Source Research

on:
  push:
    branches: [agent/scale-globe-directory-1000]
    paths: [.github/workflows/source-research.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe authoritative location directories
        shell: bash
        run: |
          set -u
          probe() {
            name="$1"; url="$2"; file="/tmp/${name}.html"
            echo "===== ${name} ====="
            code=$(curl -L --compressed --max-time 35 -A 'Mozilla/5.0 RealWorldNeeds source research' -sS -w '%{http_code}' -o "$file" "$url" || true)
            echo "status=$code bytes=$(wc -c < "$file" 2>/dev/null || echo 0) url=$url"
            echo '-- title / hints --'
            grep -Eoi '<title>[^<]+|https?://[^"'"'"'<> ]+|/[A-Za-z0-9._~:/?#@!$&()*+,;=%-]*(api|json|graphql|location|locator|foodbank|wic|map)[A-Za-z0-9._~:/?#@!$&()*+,;=%-]*' "$file" 2>/dev/null \
              | sed 's/&amp;/\&/g' | sort -u | head -n 120 || true
            echo '-- script src --'
            grep -Eoi '<script[^>]+src=["'"'][^"'"']+' "$file" 2>/dev/null | sed -E 's/.*src=["'"']//' | head -n 80 || true
          }

          probe trussell 'https://www.trussell.org.uk/emergency-food/find-a-foodbank'
          probe foodbankscanada 'https://foodbankscanada.ca/find-a-food-bank/'
          probe bahnhofsmission 'https://www.bahnhofsmission.de/index.php?id=99'
          probe californiawic 'https://www.cdph.ca.gov/Programs/CFH/DWICSN/Pages/Find-a-WIC-Local-Agency.aspx'
