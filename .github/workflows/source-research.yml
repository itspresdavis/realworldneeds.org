name: Source Research

on:
  push:
    branches: [agent/scale-globe-directory-1000]
    paths: [.github/workflows/source-research.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Trussell result markup for safe ingestion
        shell: bash
        run: |
          set -euo pipefail
          for page in 1 2 140 141 142; do
            url="https://www.trussell.org.uk/emergency-food/get-a-food-voucher/choose-a-foodbank?lat=&lng=&page=${page}"
            file="/tmp/trussell-${page}.html"
            curl -L --compressed --max-time 35 -A 'Mozilla/5.0 RealWorldNeeds source research' -sS "$url" -o "$file"
            echo "===== PAGE ${page} bytes=$(wc -c < "$file") ====="
            python - "$file" <<'PY'
          import sys, re, html
          raw=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          plain=html.unescape(raw)
          terms=['119 University Street','Get Directions','Choose food bank','food banks','postcode','__next_f.push']
          for term in terms:
              i=plain.lower().find(term.lower())
              if i >= 0:
                  print('\nTERM',term,'INDEX',i)
                  print(plain[max(0,i-1600):i+3600])
          # Show candidate address / phone blocks without dumping the page.
          print('\nCANDIDATE POSTCODES', re.findall(r'\b[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}\b', plain, flags=re.I)[:30])
          print('PHONE-LIKE', re.findall(r'(?:\+44\s?\(0\)|0)\d[\d\s()-]{7,}', plain)[:20])
          PY
          done
