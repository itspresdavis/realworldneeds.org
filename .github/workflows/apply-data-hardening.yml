name: Apply Data Hardening

on:
  push:
    branches: [agent/scale-globe-directory-1000]
    paths: [.github/workflows/apply-data-hardening.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scale-globe-directory-1000
      - name: Install dependencies
        run: npm ci
      - name: Integrate generated data and rapid-input protection
        run: python scripts/apply-data-and-input-hardening.py
      - name: Validate full catalog and production build
        run: npm run check
      - name: Commit integrated scale hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/data/resources.js src/data/live-sources.js
          git commit -m "Integrate verified UK food-bank network at scale"
          git push origin HEAD:agent/scale-globe-directory-1000
