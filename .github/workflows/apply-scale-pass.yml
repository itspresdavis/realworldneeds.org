name: Apply Scale Pass

on:
  push:
    branches: [agent/scale-globe-directory-1000]
    paths: [.github/workflows/apply-scale-pass.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scale-globe-directory-1000
      - name: Install dependencies
        run: npm ci
      - name: Apply scalable globe patch
        run: python scripts/apply-globe-scale-pass.py
      - name: Validate complete site
        run: npm run check
      - name: Commit production globe changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git commit -m "Render service points fluidly at global scale"
          git push origin HEAD:agent/scale-globe-directory-1000
