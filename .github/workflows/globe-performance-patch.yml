name: Globe Performance Patch

on:
  push:
    branches:
      - agent/globe-super-smooth

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[globe-perf-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/globe-super-smooth
      - name: Install dependencies
        run: npm ci
      - name: Apply globe optimization
        run: python scripts/apply-globe-performance.py
      - name: Verify syntax and tests
        run: npm run check
      - name: Commit optimized globe loop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git commit -m "Make globe interaction consistently smooth [globe-perf-applied]"
          git push origin HEAD:agent/globe-super-smooth
