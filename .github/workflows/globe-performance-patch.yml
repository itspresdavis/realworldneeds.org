name: Page Scroll Performance Patch

on:
  push:
    branches:
      - agent/globe-super-smooth

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[scroll-perf-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/globe-super-smooth
      - name: Install dependencies
        run: npm ci
      - name: Apply scroll-priority optimization
        run: python scripts/apply-page-scroll-performance.py
      - name: Verify syntax and tests
        run: npm run check
      - name: Commit scroll optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git commit -m "Prioritize smooth page scrolling around the globe [scroll-perf-applied]"
          git push origin HEAD:agent/globe-super-smooth
