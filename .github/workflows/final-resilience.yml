name: Final Resilience Gate

on:
  push:
    branches: [agent/scale-globe-directory-1000]
    paths: [.github/workflows/final-resilience.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scale-globe-directory-1000
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply interaction hardening
        run: python scripts/apply-final-resilience.py
      - name: Run complete validation suite
        run: npm run check
      - name: Report client payload sizes
        run: |
          wc -c src/app.js src/globe-points.js src/utils/globe-clustering.js src/data/generated/trussell-foodbanks.js
          wc -c dist/src/app.js dist/src/globe-points.js dist/data/resources.json
      - name: Commit final resilience code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git commit -m "Harden high-frequency globe and location interactions"
          git push origin HEAD:agent/scale-globe-directory-1000
