name: Filter Coalescing Gate

on:
  push:
    branches: [agent/scale-globe-directory-1000]
    paths: [.github/workflows/filter-coalescing.yml]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scale-globe-directory-1000
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/apply-filter-coalescing.py
      - run: npm run check
      - name: Commit production filter hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git commit -m "Coalesce rapid directory filter mutations"
          git push origin HEAD:agent/scale-globe-directory-1000
