name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Reject tracked build output and dependencies
        run: node scripts/check-repository-artifacts.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Audit locked dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Verify testing and release tooling
        run: |
          python3 tests/ubuntu-quality.test.py
          python3 tests/quality-backend.test.py
          python3 tests/release-tested.test.py
      - name: Validate and build
        id: validate
        run: npm run check
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
      - name: Crash-test real globe touch input
        run: |
          mkdir -p qa-screenshots
          find qa-screenshots -maxdepth 1 -type f \( -name '*.png' -o -name '*.json' \) -delete
          node scripts/browser-globe-touch-v4.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Verify rendered site
        if: ${{ !cancelled() && steps.validate.outcome == 'success' && steps.chrome.outcome == 'success' }}
        run: npm run test:browser:qa
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rwn-visual-qa
          path: |
            qa-screenshots/*.png
            qa-screenshots/*.json
          if-no-files-found: warn
          retention-days: 7

  postgres-permissions:
    name: PostgreSQL permission and migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Load pinned PostgreSQL image
        run: |
          docker pull postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
      - name: Verify isolated permissions and migrations
        run: python3 scripts/qa-postgres-permissions.py --image postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994

  cross-browser:
    name: Cross-browser / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build generated site
        run: npm run build
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify assistance journeys and accessibility
        run: npm run test:cross-browser -- --project=${{ matrix.browser }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rwn-cross-browser-${{ matrix.browser }}
          path: |
            qa-cross-browser/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
