name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate and build
        run: npm run check
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Crash-test built site
        run: npm run test:browser:chaos
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
