name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate and build
        id: validate
        run: npm run check
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Crash-test real globe touch input
        run: |
          mkdir -p qa-screenshots
          find qa-screenshots -maxdepth 1 -type f \( -name '*.png' -o -name '*.json' \) -delete
          node scripts/browser-globe-touch-v4.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Verify rendered site
        if: ${{ !cancelled() && steps.validate.outcome == 'success' && steps.chrome.outcome == 'success' }}
        run: npm run test:browser:qa
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rwn-visual-qa
          path: |
            qa-screenshots/*.png
            qa-screenshots/*.json
          if-no-files-found: warn
          retention-days: 7
